name: Decode media uploads
# Binary files (videos) are uploaded as base64 text (*.b64) because the upload
# tool only supports text. This workflow decodes them into the real file and
# removes the .b64 copy.
on:
  push:
    paths:
      - '**/*.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode *.b64 files
        run: |
          shopt -s globstar nullglob
          changed=0
          for f in **/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            git rm -q "$f"
            git add "$out"
            echo "decoded $f -> $out ($(stat -c%s "$out") bytes, sha256 $(sha256sum "$out" | cut -d' ' -f1))"
            changed=1
          done
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Decode media uploads"
            git push
          fi
